<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex layout</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            gap:20px;
            justify-content: center;
        }
        .box{
            width:200px;
            height: 200px;
            border: 2px solid black;
        }
        .box img{
            width:100%;
            height:100%;
            object-fit: cover;
        }    </style>
</head>
<body>
    <h2>Flower Gallery-Flex Row Layout</h2>
    <div class="container">
        <div class="box"><img src="flower.png" alt="Yellow flower"></div>
         <div class="box"><img src="flower.png" alt="Yellow flower"></div>
          <div class="box"><img src="flower.png" alt="Yellow flower"></div>
           <div class="box"><img src="flower.png" alt="Yellow flower"></div>
    </div>
    
</body>
</html>
